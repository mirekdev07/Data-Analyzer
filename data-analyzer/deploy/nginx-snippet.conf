# --- Data Analyzer (added 2026-05-29) -----------------------------
# Paste this block into the existing /etc/nginx/sites-available/mirekdev.pl
# IMMEDIATELY BEFORE the existing `location /` block.
# Do NOT create a new vhost file.

location = /analyzer {
    return 301 /analyzer/;
}

location /analyzer/api/ {
    proxy_pass http://127.0.0.1:8101/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
    proxy_read_timeout 120s;
}

location /analyzer/ {
    alias /var/www/analyzer/frontend/dist/;
    try_files $uri $uri/ /analyzer/index.html;
}

# --- end Data Analyzer --------------------------------------------
