server {
    server_name mirekdev.pl;

    # ACME challenge dla certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Data Analyzer (added 2026-05-29) -----------------------------
    location = /analyzer {
        return 301 /analyzer/;
    }

    location /analyzer/api/ {
        proxy_pass http://127.0.0.1:8101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    location /analyzer/ {
        alias /var/www/analyzer/frontend/dist/;
        try_files $uri $uri/ /analyzer/index.html;
    }
    # --- end Data Analyzer --------------------------------------------

    # Reverse proxy do Next.js (pm2 portfolio na :3100)
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Long-cache statyki Next
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mirekdev.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mirekdev.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mirekdev.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name mirekdev.pl;
    return 404; # managed by Certbot


}
